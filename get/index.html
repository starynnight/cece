<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0910">
<meta name="robots" content="noindex">
<title>领取测评密码 · 测测研究所</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(120% 60% at 50% -10%,#1E1428 0%,#0B0910 62%),#0B0910;
  background-attachment:fixed;color:#F5EFF4;min-height:100vh;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(30px + env(safe-area-inset-bottom));
}
.wrap{max-width:520px;margin:0 auto;padding:0 20px}
.brand{display:flex;align-items:center;gap:8px;justify-content:center;padding:26px 0 0;
  font-size:11.5px;letter-spacing:3px;color:#A99CB0;font-weight:600}
.brand i{width:5px;height:5px;border-radius:50%;background:#E4577C;display:inline-block}
.hero{text-align:center;padding:30px 0 6px}
.hero .logo{font-size:60px;line-height:1;animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
h1{font-size:25px;font-weight:800;margin-top:16px;line-height:1.4}
.sub{font-size:13.5px;line-height:1.8;color:#A99CB0;margin-top:11px}
.card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.11);
  border-radius:22px;padding:24px 20px;margin-top:20px}
.pwdbox{margin-top:4px;text-align:center}
.pwdbox .lb{font-size:11.5px;color:#A99CB0;letter-spacing:1px;margin-bottom:12px}
.pwd{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:26px;font-weight:800;letter-spacing:2px;color:#F5DC9C;
  word-break:break-all;line-height:1.45;user-select:all;-webkit-user-select:all;
  background:rgba(0,0,0,.32);border:1.5px dashed rgba(255,255,255,.2);
  border-radius:14px;padding:18px 12px;
}
.btn{display:block;width:100%;padding:16px;border:none;border-radius:15px;font-size:16.5px;
  font-weight:700;font-family:inherit;cursor:pointer;color:#fff;margin-top:12px;
  background:linear-gradient(135deg,#FF9DB6,#E4577C);box-shadow:0 8px 24px rgba(228,87,124,.32);
  transition:transform .14s}
.btn:active{transform:scale(.965)}
.btn.ghost{background:transparent;color:#F5EFF4;border:1.5px solid rgba(255,255,255,.16);
  box-shadow:none;font-weight:600}
.btn.gold{background:linear-gradient(135deg,#F5DC9C,#D8A445);box-shadow:0 8px 24px rgba(216,164,69,.3)}
.tip{font-size:12.5px;color:#A99CB0;line-height:1.85;margin-top:14px;text-align:center}
.bad{text-align:center;padding:10px 0}
.bad .e{font-size:52px}
.bad h2{font-size:19px;font-weight:800;margin-top:14px;color:#FF9DB3}
.bad p{font-size:13.5px;color:#A99CB0;line-height:1.85;margin-top:10px}
.hide{display:none!important}
.golink{display:block;text-align:center;margin-top:16px;font-size:13.5px;color:#A99CB0;
  text-decoration:none;line-height:1.8}
.golink b{color:#FF9DB6}
#toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);
  background:rgba(30,20,35,.96);color:#fff;padding:12px 22px;border-radius:24px;font-size:13.5px;
  z-index:99;opacity:0;transition:all .28s;pointer-events:none;border:1px solid rgba(255,255,255,.12)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.meta{font-size:11px;color:#7E7385;text-align:center;margin-top:18px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><i></i>测 测 研 究 所<i></i></div>

  <!-- 选择页 -->
  <div id="pick">
    <div class="hero">
      <div class="logo">🎁</div>
      <h1>领取你的测评密码</h1>
      <p class="sub">选一个你要做的测评<br>点一下，密码自动发给你</p>
    </div>
    <div class="card">
      <button class="btn" onclick="go('XZL')">💋 性张力测试</button>
      <button class="btn gold" onclick="go('RQSG')">👑 人情世故段位</button>
      <div class="tip">每个密码可用 3 次 · 做完能生成图片存到相册</div>
    </div>
  </div>

  <!-- 领取中 -->
  <div id="loading" class="hide">
    <div class="hero">
      <div class="logo">🔑</div>
      <h1>正在为你取密码…</h1>
      <p class="sub"><span class="spin"></span>稍等一下</p>
    </div>
  </div>

  <!-- 成功 -->
  <div id="done" class="hide">
    <div class="hero">
      <div class="logo">🎉</div>
      <h1 id="doneTitle">密码领到了</h1>
      <p class="sub" id="doneSub">这是你的专属密码，请截图保存</p>
    </div>
    <div class="card">
      <div class="pwdbox">
        <div class="lb">你的密码（点一下可复制）</div>
        <div class="pwd" id="pwd" onclick="copyPwd()"></div>
      </div>
      <button class="btn" onclick="copyPwd()">📋 复制密码</button>
      <a class="btn ghost" id="goTest" style="text-align:center;text-decoration:none;display:none"
         href="#">🚀 现在去测试</a>
      <div class="tip">
        复制后在测评首页粘贴即可<br>
        <b style="color:#FF9DB6">建议先截图保存</b>，免得关掉页面忘了
      </div>
    </div>
    <div class="meta">测测研究所 · 仅供娱乐与自我观察</div>
  </div>

  <!-- 失败 -->
  <div id="fail" class="hide">
    <div class="hero">
      <div class="logo">😥</div>
      <h1 id="failTitle">暂时取不到密码</h1>
    </div>
    <div class="card">
      <div class="bad">
        <h2 id="failMain"></h2>
        <p id="failDesc"></p>
      </div>
      <button class="btn ghost" onclick="retry()">🔄 再试一次</button>
    </div>
    <div class="meta">如果多次失败，请联系客服</div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ===== 配置 ===== */
var SB_URL = 'https://ytflyofjtsttinucrtfj.supabase.co';
var SB_KEY = 'sb_publishable_OttYqTcRqXnf-snk20SLpg_fTT2RLxF';
var TESTS = {
  XZL:  { name:'性张力测试',  emoji:'💋', path:'../tension/' },
  RQSG: { name:'人情世故段位', emoji:'👑', path:'../savvy/'   }
};
var CACHE = 'cece_code_v1';
var DEVKEY = 'cece_dev_v1';

function $(id){ return document.getElementById(id); }
function show(id){
  ['pick','loading','done','fail'].forEach(function(s){ $(s).classList.toggle('hide', s !== id); });
  window.scrollTo(0,0);
}
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._tm); t._tm = setTimeout(function(){ t.classList.remove('on'); }, 1900);
}
function deviceId(){
  var d = null;
  try{ d = localStorage.getItem(DEVKEY); }catch(e){}
  if (!d){
    d = 'd' + Date.now().toString(36) + '-' +
        Math.random().toString(36).slice(2,10) + Math.random().toString(36).slice(2,10);
    try{ localStorage.setItem(DEVKEY, d); }catch(e){}
  }
  return d;
}
function cacheGet(p){
  try{ return JSON.parse(localStorage.getItem(CACHE)) || {}; }catch(e){ return {}; }
}
function cacheSet(p, code){
  try{
    var o = cacheGet(); o[p] = code; localStorage.setItem(CACHE, JSON.stringify(o));
  }catch(e){}
}
var PREFIX = '';

function go(p){
  PREFIX = p;
  var cached = cacheGet()[p];
  show('loading');
  claim(p).then(function(d){
    if (d && d.ok){
      render(p, d.pwd, d.again);
      cacheSet(p, d.pwd);
      return;
    }
    // 网络/服务端失败但有缓存 → 给缓存
    if (cached){ render(p, cached, true); return; }
    failWith((d && d.reason) || 'error');
  }).catch(function(){
    if (cached){ render(p, cached, true); return; }
    failWith('network');
  });
}
function retry(){ if (PREFIX) go(PREFIX); else show('pick'); }

function claim(prefix){
  var body = { p_prefix: prefix, p_device: deviceId(), p_ip: '' };
  return fetch(SB_URL.replace(/\/+$/, '') + '/rest/v1/rpc/claim_code', {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(r){
    return r.text().then(function(t){
      var j = null;
      try{ j = JSON.parse(t); }catch(e){}
      if (j === null) throw new Error('bad_response');
      return j;
    });
  });
}

function render(p, code, again){
  var t = TESTS[p];
  $('pwd').textContent = code;
  $('doneTitle').textContent = again ? '你之前领到的密码' : '密码领到了';
  $('doneSub').innerHTML = t.emoji + ' ' + t.name +
    (again ? '<br>这是同一个密码，不必重复领取' : '<br>这是你的专属密码，建议截图保存');
  var a = $('goTest');
  a.href = t.path;
  a.style.display = 'block';
  a.textContent = '🚀 去测「' + t.name + '」';
  show('done');
}

function failWith(reason){
  var M = {
    empty:       ['今天的密码发完了', '库存已领完，请联系客服补货，或明天再来试试。'],
    ip_limit:    ['今天领得有点多', '同一个网络今天已经领过了。如果你换过设备或浏览器，请用原来那个打开；确实没领到请联系客服。'],
    daily_cap:   ['今天的份额发完了', '为了保护库存，今天的发放已到上限。请联系客服，或明天再来。'],
    bad_request: ['请求异常', '请退回上一页重新点一次。'],
    network:     ['网络不太顺畅', '请检查网络后点下面「再试一次」。'],
    error:       ['服务暂时不可用', '稍等一会儿再点「再试一次」。']
  };
  var m = M[reason] || M.error;
  $('failMain').textContent = m[0];
  $('failDesc').textContent = m[1];
  show('fail');
}

function copyPwd(){
  var txt = $('pwd').textContent;
  if (!txt) return;
  var done = false;
  try{
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
    done = document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(e){}
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast('已复制，去测评页粘贴 🎉'); },
      function(){ toast(done ? '已复制 🎉' : '长按上面的密码手动复制'); });
  } else {
    toast(done ? '已复制，去测评页粘贴 🎉' : '长按上面的密码手动复制');
  }
}

/* 初始化：支持 /get/?t=XZL 直接领 */
(function(){
  var m = location.search.match(/[?&]t=([A-Za-z]+)/);
  var p = m ? m[1].toUpperCase() : '';
  if (p && TESTS[p]){ go(p); } else { show('pick'); }
})();
</script>
</body>
</html>
